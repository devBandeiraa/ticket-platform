# booking-service — nucleo do projeto: reserva com lock distribuido e outbox.
#
# Duas replicas de proposito, e nao por redundancia: e o que exercita, num cluster de verdade,
# o desenho que o projeto vem afirmando desde a Fase 4.
#
#   - As duas varrem a outbox ao mesmo tempo. Ambas podem publicar a mesma mensagem, porque o
#     publicador envia e so entao marca. Quem resolve e a deduplicacao por message-id no
#     consumidor, e nao um lock no produtor.
#   - As duas rodam o job de expiracao. A transicao e um UPDATE condicional, entao apenas uma
#     consegue expirar cada reserva — a outra afeta zero linhas e nao devolve estoque duas vezes.
#
# Nada disso e novidade nos manifestos: e o codigo que ja estava preparado. O Kubernetes so
# oferece o lugar para provar.

apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: ticket-platform
spec:
  selector:
    app: booking-service
  ports:
    - port: 8083
      targetPort: 8083

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: ticket-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      initContainers:
        - name: espera-dependencias
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'until nc -z postgres 5432 && nc -z redis 6379 && nc -z rabbitmq 5672; do sleep 2; done'
      containers:
        - name: booking-service
          image: ticket-platform-booking-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            # Chamada servico a servico, por dentro do cluster: nao passa pelo gateway. O
            # gateway e a porta de quem vem de fora; o transito interno so ganharia um salto
            # de rede e um ponto de falha a mais.
            - name: EVENT_SERVICE_URL
              value: "http://event-service:8082"
          envFrom:
            - configMapRef: { name: plataforma }
            - secretRef: { name: jwt }
            - secretRef: { name: booking-db }
            - secretRef: { name: rabbitmq }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            periodSeconds: 20
          resources:
            requests: { cpu: 150m, memory: 384Mi }
            limits: { memory: 768Mi }
