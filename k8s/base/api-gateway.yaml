# api-gateway — porta unica da plataforma.
#
# Duas replicas: e a resposta ao risco #9 do mapeamento, que registrava o gateway como ponto
# unico de falha. Ele e stateless — a sessao vive no JWT e o balde de rate limit no Redis —
# entao replicar nao exige afinidade de sessao nem nada compartilhado entre as replicas.

apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ticket-platform
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ticket-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        - name: espera-redis
          image: busybox:1.36
          command: ["sh", "-c", 'until nc -z redis 6379; do sleep 2; done']
      containers:
        - name: api-gateway
          image: ticket-platform-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            # Nomes de Service do cluster, resolvidos pelo DNS interno. Trocar uma replica de
            # servico de lugar nao muda nada aqui.
            - name: AUTH_SERVICE_URI
              value: "http://auth-service:8081"
            - name: EVENT_SERVICE_URI
              value: "http://event-service:8082"
            - name: BOOKING_SERVICE_URI
              value: "http://booking-service:8083"
            # Origem do NAVEGADOR, e nao nome de Service: o preflight parte da maquina de quem
            # acessa, que nao enxerga a rede do cluster.
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:5173"
          envFrom:
            - configMapRef: { name: plataforma }
            - secretRef: { name: jwt }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 640Mi }
