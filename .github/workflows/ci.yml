# ============================================================================
#  Integração contínua.
#
#  Até aqui o README afirmava "356 testes" e ninguém que abrisse o repositório
#  tinha como conferir. O pipeline troca a afirmação por evidência.
#
#  Dois jobs em paralelo porque são ferramentas, caches e tempos distintos: o
#  backend sobe containers e leva mais de dez minutos; o frontend resolve em
#  menos de um. Num job só, quem espera é o conjunto — e um erro de digitação no
#  TypeScript só apareceria depois de todo o Testcontainers rodar.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Disparo manual. Util para reexecutar apos uma falha de infraestrutura do
  # runner — repetir um build que caiu por rede nao deveria exigir um commit
  # vazio so para provocar o gatilho.
  workflow_dispatch:

# Um push novo na mesma branch cancela a execução anterior. Sem isto, uma
# sequência de correções deixa três builds obsoletos ocupando a fila — e o
# resultado que importa, o do último commit, é o que sai por último.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — testes e cobertura
    runs-on: ubuntu-latest
    # Os testes de concorrência sobem PostgreSQL, Redis e RabbitMQ reais e
    # disparam 200 threads. Localmente o booking-service leva cinco minutos e
    # meio; num runner de dois núcleos leva mais. O teto existe para um travamento
    # não consumir a cota, e não para apertar o tempo normal.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          # Guarda o ~/.m2 entre execuções. Sem isso, cada build rebaixa dezenas
          # de megabytes de dependências antes de compilar a primeira classe.
          cache: maven

      # Sem `services:` do Actions de propósito. O Testcontainers gerencia o ciclo
      # de vida dos containers por conta própria — declarar um PostgreSQL ao lado
      # criaria um segundo banco que nenhum teste usa, e que ainda assim ocuparia
      # memória do runner. O Docker já vem instalado no ubuntu-latest.
      - name: Build, testes e cobertura
        run: ./mvnw -B clean verify

      # Os relatórios só interessam quando algo quebra, e é justamente aí que o
      # log do console não basta: ele mostra o nome do teste, não a asserção que
      # falhou nem o stack trace.
      - name: Relatórios de teste (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: cobertura/target/site/jacoco-agregado/
          retention-days: 7

      # Lê o CSV do relatório agregado e escreve o número no resumo da execução,
      # que é a primeira tela que alguém vê ao abrir o build. Um HTML dentro de um
      # artefato exige baixar, descompactar e abrir — três passos que ninguém dá.
      - name: Cobertura no resumo
        if: always()
        run: |
          arquivo=cobertura/target/site/jacoco-agregado/jacoco.csv
          if [ ! -f "$arquivo" ]; then
            echo "Relatório de cobertura não foi gerado." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -F, 'NR>1 {
              perdidas += $8; cobertas += $9
              if ($2 ~ /\.service$/) { sPerdidas += $8; sCobertas += $9 }
            }
            END {
              printf "## Cobertura\n\n"
              printf "| | linhas | cobertura |\n|---|---|---|\n"
              printf "| Agregado | %d | **%.1f%%** |\n", perdidas + cobertas,
                     100 * cobertas / (perdidas + cobertas)
              if (sPerdidas + sCobertas > 0)
                printf "| Camadas de service | %d | **%.1f%%** |\n",
                       sPerdidas + sCobertas, 100 * sCobertas / (sPerdidas + sCobertas)
            }' "$arquivo" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend — lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` e não `npm install`: instala exatamente o que está no lock, e
      # falha se ele divergir do package.json. Um build de integração que resolve
      # versões sozinho pode passar com dependências que ninguém revisou.
      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # Por último e não por acaso: `npm run build` roda `tsc -b`, e é o único
      # passo que pega erro de tipo. Os testes passam sem ele — o Vitest transpila
      # sem verificar tipos.
      - name: Build
        run: npm run build
