server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache longo so para os arquivos com hash no nome, que o Vite gera. O nome muda a cada
    # build, entao nunca ha versao velha presa no navegador.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index.html nao pode ser cacheado: e ele que aponta para os assets novos. Cacheado,
    # o navegador continuaria pedindo os arquivos da versao anterior, que ja nao existem.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Roteamento no cliente: /minhas-reservas nao e um arquivo em disco. Sem este fallback,
    # o nginx responderia 404 a qualquer recarregamento fora da raiz — e a rota funcionaria
    # navegando pelo app, mas quebraria ao apertar F5, que e o pior tipo de bug.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
