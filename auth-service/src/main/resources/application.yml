server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${AUTH_DB_NAME:authdb}
    username: ${AUTH_DB_USER:auth_user}
    password: ${AUTH_DB_PASSWORD:auth_pass}

  jpa:
    # O schema e responsabilidade das migrations do Flyway. `validate` faz o
    # Hibernate apenas conferir se as entidades batem com o banco, e falhar
    # na subida se divergirem.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # Segredo do HS256, compartilhado com o api-gateway, que valida os tokens sem chamar este
  # servico. O valor abaixo e apenas para desenvolvimento local: em qualquer ambiente real
  # defina JWT_SECRET com um valor aleatorio de no minimo 32 bytes.
  secret: ${JWT_SECRET:desenvolvimento-local-troque-este-segredo-antes-de-publicar}
  issuer: ticket-platform-auth
  # Curto porque um access token nao pode ser revogado: a janela de estrago de um token
  # vazado e o proprio tempo de vida dele.
  access-token-ttl: 15m
  # Longo, mas revogavel — fica no banco, e o logout o invalida.
  refresh-token-ttl: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.devbandeiraa.authservice: DEBUG

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    # Caminho prefixado com o proprio recurso, e nao o `/v3/api-docs` padrao. O motivo e o
    # gateway: ele aplica `StripPrefix=1` a tudo, entao `/api/auth/v3/api-docs` chega aqui
    # como `/auth/v3/api-docs`. Com o caminho padrao seria preciso uma rota dedicada no
    # gateway so para a documentacao, com filtros para desfazer o strip; assim a especificacao
    # viaja pela mesma rota que ja existe para o recurso.
    path: /auth/v3/api-docs
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    # A interface agregada mora no gateway. Esta aqui serve para abrir o servico isolado
    # durante o desenvolvimento, sem subir a plataforma inteira.
    path: /swagger-ui.html
    # Ordena as operacoes pelo verbo em vez da ordem de declaracao no controller, que nao
    # significa nada para quem le.
    operationsSorter: method
    tagsSorter: alpha

---
# Perfil de desenvolvimento: acrescenta a pasta db/dev as locations do Flyway,
# onde vive o seed do primeiro administrador.
#
# Nao ha profile padrao de proposito. Se `dev` fosse o padrao, subir em producao
# sem lembrar de sobrescrever criaria um admin com senha publicamente conhecida —
# o tipo de erro que so se descobre tarde demais. Aqui o seed precisa ser pedido
# explicitamente:
#
#     ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#     SPRING_PROFILES_ACTIVE=dev java -jar auth-service.jar
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/dev
