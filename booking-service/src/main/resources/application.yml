server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${BOOKING_DB_NAME:bookingdb}
    username: ${BOOKING_DB_USER:booking_user}
    password: ${BOOKING_DB_PASSWORD:booking_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Backend do lock distribuido que protege a reserva contra overselling (Fase 4).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

    web:
      pageable:
        # Teto de itens por pagina. Sem ele, um `size=1000000` na URL viraria uma varredura
        # completa da tabela a cada requisicao.
        max-page-size: 100

  # Publica os eventos de reserva consumidos pelo notification-service (Fase 4/5).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ticket}
    password: ${RABBITMQ_PASSWORD:ticket}

    template:
      # Faz o RabbitTemplate abrir um span por publicacao e injetar o contexto nos cabecalhos da
      # mensagem. E o que leva o trace ate o notification-service: sem isto a mensagem viaja sem
      # contexto e o consumidor comeca uma arvore propria, desligada da compra.
      #
      # O contexto injetado e o corrente. Como o OutboxPublisher restaura o da requisicao original
      # antes de publicar, o que vai na mensagem e o da compra — e nao o da thread do job.
      observation-enabled: true

# Lock distribuido que serializa as tentativas de reserva do mesmo evento.
#
# Vale insistir: nenhum destes valores afeta a CORRECAO do sistema. Errar o TTL para menos faz
# o lock expirar no meio da secao critica; deixar o Redis cair faz o servico seguir sem lock
# nenhum. Em ambos os casos o UPDATE condicional no banco continua recusando qualquer reserva
# que estoure a capacidade. O que estes numeros ajustam e o quanto de disputa chega ao banco.
jwt:
  # Mesmo segredo do auth-service: e o que permite validar o token aqui sem chamar aquele
  # servico a cada requisicao. Este servico apenas valida — nao ha como emitir token daqui.
  secret: ${JWT_SECRET:desenvolvimento-local-troque-este-segredo-antes-de-publicar}
  issuer: ticket-platform-auth

booking:
  reserva:
    # Prazo para pagar antes de a reserva expirar e devolver o estoque.
    ttl: ${BOOKING_RESERVA_TTL:10m}
    # Mesmo limite da coluna idempotency_key: validar antes evita que uma chave longa demais
    # chegue ao banco e vire erro de integridade em vez de erro de validacao.
    tamanho-maximo-da-chave: 100

  expiracao:
    # Intervalo entre varreduras, contado a partir do FIM da execucao anterior (fixedDelay).
    intervalo: ${BOOKING_EXPIRACAO_INTERVALO:60s}
    # Espera o servico terminar de subir antes da primeira varredura.
    atraso-inicial: ${BOOKING_EXPIRACAO_ATRASO_INICIAL:30s}
    # Teto por execucao: se o job ficar horas fora do ar, a primeira passada ao voltar nao deve
    # tentar processar tudo de uma vez. O que sobrar sai na varredura seguinte.
    tamanho-do-lote: ${BOOKING_EXPIRACAO_LOTE:200}

  outbox:
    # Latencia que a outbox acrescenta a notificacao: e o preco de trocar publicacao imediata por
    # publicacao garantida. Dois segundos e imperceptivel para um e-mail de confirmacao.
    intervalo: ${BOOKING_OUTBOX_INTERVALO:2s}
    atraso-inicial: ${BOOKING_OUTBOX_ATRASO_INICIAL:10s}
    tamanho-do-lote: ${BOOKING_OUTBOX_LOTE:100}
    # Depois disso a mensagem e marcada como FAILED e sai do caminho. Perder uma notificacao e
    # ruim; deixar uma mensagem envenenada ocupar o lote a cada varredura e pior.
    max-tentativas: ${BOOKING_OUTBOX_MAX_TENTATIVAS:5}

  event-service:
    url: ${EVENT_SERVICE_URL:http://localhost:8082}
    # Curtos de proposito: esta chamada acontece dentro do pedido de reserva de alguem, e um
    # event-service lento nao pode prender threads deste servico ate esgotar o pool.
    connect-timeout: ${EVENT_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${EVENT_SERVICE_READ_TIMEOUT:3s}

  pagamento:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8085}
    # Mais folgados que os do event-service, e nao por descuido: autorizar uma cobranca envolve um
    # terceiro que legitimamente demora centenas de milissegundos. Copiar os 3s de leitura de la
    # faria o retry disparar contra cobrancas que teriam passado, e cada tentativa a mais e uma
    # chance a mais de cobrar em duplicidade caso a idempotencia falhe do outro lado.
    connect-timeout: ${PAYMENT_CONNECT_TIMEOUT:2s}
    read-timeout: ${PAYMENT_READ_TIMEOUT:5s}

  lock:
    # Uma ordem de grandeza acima da transacao protegida (um UPDATE e um INSERT).
    ttl: ${BOOKING_LOCK_TTL:3s}
    tentativas: ${BOOKING_LOCK_TENTATIVAS:3}
    # Cresce a cada tentativa e recebe jitter, para as threads que colidiram nao voltarem a
    # colidir em bloco.
    espera-entre-tentativas: ${BOOKING_LOCK_ESPERA:50ms}

# Resiliencia das duas chamadas que saem deste servico.
#
# Sao dois vizinhos com naturezas diferentes, e por isso duas defesas diferentes. O event-service e
# nosso, roda ao lado e responde rapido: quando falha, tende a continuar falhando, e insistir so
# empilha requisicoes sobre um servico ja doente — dai circuit breaker. O provedor de pagamento e
# um terceiro atras da internet, onde a falha isolada e transitoria e o caso comum — dai retry.
#
# Aplicar o inverso seria pior que nao aplicar nada: retry contra um servico caido multiplicaria a
# carga sobre ele por quatro, e circuit breaker num provedor de pagamento recusaria vendas por
# causa de um pico de latencia que teria passado sozinho.
resilience4j:
  circuitbreaker:
    instances:
      event-service:
        # Contagem, e nao janela de tempo: a hidratacao acontece uma vez por evento, entao o
        # volume e baixo e irregular. Numa janela por tempo, um minuto com duas chamadas das quais
        # uma falhou daria 50% de falha e abriria o circuito sobre quase nenhuma evidencia.
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${CB_EVENT_JANELA:10}
        minimum-number-of-calls: ${CB_EVENT_MINIMO:5}
        failure-rate-threshold: ${CB_EVENT_LIMIAR:50}
        # Curto de proposito. E o intervalo entre o circuito abrir e ele deixar passar as
        # primeiras chamadas de teste, e portanto o tempo que a demonstracao leva mostrando uma
        # tela parada. Num ambiente real seria bem maior.
        wait-duration-in-open-state: ${CB_EVENT_ESPERA:10s}
        permitted-number-of-calls-in-half-open-state: 3
        # Sem isto, o circuito so sai de aberto quando alguem tenta uma chamada. Num evento com
        # pouco trafego ele ficaria aberto muito depois de o servico ter voltado.
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        # Este flag evita um tiro no pe. Com ele em `true`, um circuito aberto faria o
        # /actuator/health devolver DOWN — e como e esse mesmo endereco que o healthcheck do
        # compose consulta, o Docker marcaria o booking-service como unhealthy e o reiniciaria.
        #
        # O servico estaria sendo morto justamente por ter se defendido corretamente da queda de
        # outro. Pior ainda numa demonstracao, em que a ideia e derrubar o event-service e observar
        # o circuito abrir: o container que se quer observar seria o primeiro a cair.
        #
        # Com `false`, o estado do circuito continua visivel dentro do corpo do /health, mas nao
        # define o status geral.
        allow-health-indicator-to-fail: false
        # A configuracao mais importante deste bloco. Um 404 significa que o event-service esta
        # saudavel e respondeu depressa; conta-lo como falha faria um punhado de usuarios digitando
        # ids errados derrubar a hidratacao de todos os eventos legitimos.
        ignore-exceptions:
          - com.devbandeiraa.bookingservice.exception.EventoNaoDisponivelException
        record-exceptions:
          - com.devbandeiraa.bookingservice.exception.EventServiceIndisponivelException

  retry:
    instances:
      pagamento:
        # Quatro no total: a original e tres repeticoes. Com o backoff abaixo, o pior caso soma
        # cerca de 1,4s de espera — dentro do que alguem tolera olhando para um botao de pagar.
        max-attempts: ${RETRY_PAGAMENTO_TENTATIVAS:4}
        wait-duration: ${RETRY_PAGAMENTO_ESPERA:200ms}
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Jitter. Sem ele, todas as tentativas que falharam juntas voltam juntas, exatamente 200ms
        # depois, e o provedor que estava se recuperando leva a mesma rajada de novo. E o efeito
        # manada que o backoff sozinho nao resolve.
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - com.devbandeiraa.bookingservice.exception.PagamentoIndisponivelException
        # Recusa e resposta, nao falha. Repeti-la gastaria quatro tentativas para chegar a mesma
        # negativa, com o usuario esperando por nada.
        ignore-exceptions:
          - com.devbandeiraa.bookingservice.exception.PagamentoRecusadoException

management:
  endpoints:
    web:
      exposure:
        # `circuitbreakers` publica o estado atual de cada instancia, que e o que o painel /status
        # do frontend consome e o que se aponta numa demonstracao. `circuitbreakerevents` e
        # `retryevents` guardam o historico das ultimas transicoes — util para explicar por que o
        # circuito abriu, em vez de apenas mostrar que abriu.
        include: health,info,circuitbreakers,circuitbreakerevents,retries,retryevents
  endpoint:
    health:
      show-details: always
  # Tracing distribuido.
  #
  # Amostragem em 100%: e uma decisao de projeto de estudo, e nao um padrao a copiar. Em producao
  # este numero seria uma fracao pequena — guardar um trace de cada requisicao de um sistema com
  # volume real custa armazenamento e banda a toa, porque a maioria dos traces e de requisicoes
  # que deram certo e ninguem vai olhar. Aqui o valor de um trace e didatico: cada reserva feita
  # numa demonstracao precisa aparecer, ou o Jaeger fica vazio justamente na hora de mostrar.
  tracing:
    sampling:
      probability: ${TRACING_AMOSTRAGEM:1.0}
  otlp:
    tracing:
      # Protocolo OTLP sobre HTTP, e nao o formato nativo do Jaeger. O ganho e nao ficar preso a
      # ele: trocar por Tempo, Zipkin ou um coletor gerenciado passa a ser mudar este endereco,
      # sem tocar em dependencia nem em codigo de servico nenhum.
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

  health:
    circuitbreakers:
      # Faz o estado do circuito aparecer dentro do /actuator/health. Deliberadamente ligado: um
      # circuito aberto e informacao de saude legitima, e sem isto o servico se declararia
      # perfeitamente saudavel enquanto recusa toda hidratacao de estoque.
      enabled: true

logging:
  # Prefixa cada linha com dois identificadores: o X-Request-Id, posto no MDC pelo
  # CorrelacaoServletFilter, e o traceId do OpenTelemetry, posto pelo Micrometer Tracing.
  #
  # Sao dois porque servem a momentos diferentes. O requestId e o que aparece na tela de erro e
  # que o usuario consegue ditar; o traceId e o que se cola na busca do Jaeger. Com os dois na
  # mesma linha, ir de um ao outro e um grep.
  #
  # `pattern.correlation` e um encaixe que o Boot ja reserva dentro do padrao padrao: preenche-lo
  # evita redefinir data, nivel e thread so para acrescentar campos. Preencher e tambem o que
  # impede o Boot de trocar este campo pelo formato proprio dele assim que o tracing entra no
  # classpath. O `:-` deixa cada campo vazio fora do respectivo contexto.
  pattern:
    correlation: "[%X{requestId:-} %X{traceId:-}] "
  level:
    com.devbandeiraa.bookingservice: DEBUG

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    # Caminho prefixado com o proprio recurso, e nao o `/v3/api-docs` padrao. O motivo e o
    # gateway: ele aplica `StripPrefix=1` a tudo, entao `/api/bookings/v3/api-docs` chega aqui
    # como `/bookings/v3/api-docs`. Com o caminho padrao seria preciso uma rota dedicada no
    # gateway so para a documentacao, com filtros para desfazer o strip; assim a especificacao
    # viaja pela mesma rota que ja existe para o recurso.
    path: /bookings/v3/api-docs
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    # A interface agregada mora no gateway. Esta aqui serve para abrir o servico isolado
    # durante o desenvolvimento, sem subir a plataforma inteira.
    path: /swagger-ui.html
    # Ordena as operacoes pelo verbo em vez da ordem de declaracao no controller, que nao
    # significa nada para quem le.
    operationsSorter: method
    tagsSorter: alpha
