server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${BOOKING_DB_NAME:bookingdb}
    username: ${BOOKING_DB_USER:booking_user}
    password: ${BOOKING_DB_PASSWORD:booking_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Backend do lock distribuido que protege a reserva contra overselling (Fase 4).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  # Publica os eventos de reserva consumidos pelo notification-service (Fase 4/5).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ticket}
    password: ${RABBITMQ_PASSWORD:ticket}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.devbandeiraa.bookingservice: DEBUG
