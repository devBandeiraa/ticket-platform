server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${BOOKING_DB_NAME:bookingdb}
    username: ${BOOKING_DB_USER:booking_user}
    password: ${BOOKING_DB_PASSWORD:booking_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Backend do lock distribuido que protege a reserva contra overselling (Fase 4).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

    web:
      pageable:
        # Teto de itens por pagina. Sem ele, um `size=1000000` na URL viraria uma varredura
        # completa da tabela a cada requisicao.
        max-page-size: 100

  # Publica os eventos de reserva consumidos pelo notification-service (Fase 4/5).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ticket}
    password: ${RABBITMQ_PASSWORD:ticket}

# Lock distribuido que serializa as tentativas de reserva do mesmo evento.
#
# Vale insistir: nenhum destes valores afeta a CORRECAO do sistema. Errar o TTL para menos faz
# o lock expirar no meio da secao critica; deixar o Redis cair faz o servico seguir sem lock
# nenhum. Em ambos os casos o UPDATE condicional no banco continua recusando qualquer reserva
# que estoure a capacidade. O que estes numeros ajustam e o quanto de disputa chega ao banco.
jwt:
  # Mesmo segredo do auth-service: e o que permite validar o token aqui sem chamar aquele
  # servico a cada requisicao. Este servico apenas valida — nao ha como emitir token daqui.
  secret: ${JWT_SECRET:desenvolvimento-local-troque-este-segredo-antes-de-publicar}
  issuer: ticket-platform-auth

booking:
  reserva:
    # Prazo para pagar antes de a reserva expirar e devolver o estoque.
    ttl: ${BOOKING_RESERVA_TTL:10m}
    # Mesmo limite da coluna idempotency_key: validar antes evita que uma chave longa demais
    # chegue ao banco e vire erro de integridade em vez de erro de validacao.
    tamanho-maximo-da-chave: 100

  expiracao:
    # Intervalo entre varreduras, contado a partir do FIM da execucao anterior (fixedDelay).
    intervalo: ${BOOKING_EXPIRACAO_INTERVALO:60s}
    # Espera o servico terminar de subir antes da primeira varredura.
    atraso-inicial: ${BOOKING_EXPIRACAO_ATRASO_INICIAL:30s}
    # Teto por execucao: se o job ficar horas fora do ar, a primeira passada ao voltar nao deve
    # tentar processar tudo de uma vez. O que sobrar sai na varredura seguinte.
    tamanho-do-lote: ${BOOKING_EXPIRACAO_LOTE:200}

  event-service:
    url: ${EVENT_SERVICE_URL:http://localhost:8082}
    # Curtos de proposito: esta chamada acontece dentro do pedido de reserva de alguem, e um
    # event-service lento nao pode prender threads deste servico ate esgotar o pool.
    connect-timeout: ${EVENT_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${EVENT_SERVICE_READ_TIMEOUT:3s}

  lock:
    # Uma ordem de grandeza acima da transacao protegida (um UPDATE e um INSERT).
    ttl: ${BOOKING_LOCK_TTL:3s}
    tentativas: ${BOOKING_LOCK_TENTATIVAS:3}
    # Cresce a cada tentativa e recebe jitter, para as threads que colidiram nao voltarem a
    # colidir em bloco.
    espera-entre-tentativas: ${BOOKING_LOCK_ESPERA:50ms}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.devbandeiraa.bookingservice: DEBUG
