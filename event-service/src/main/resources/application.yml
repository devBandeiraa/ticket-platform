server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: event-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${EVENT_DB_NAME:eventdb}
    username: ${EVENT_DB_USER:event_user}
    password: ${EVENT_DB_PASSWORD:event_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        # Teto de itens por pagina. Sem ele, um `size=1000000` na URL viraria uma
        # varredura completa da tabela a cada requisicao, de graca, para qualquer
        # visitante.
        max-page-size: 100

jwt:
  # Mesmo segredo do auth-service: e o que permite validar o token aqui sem precisar
  # chamar aquele servico a cada requisicao. Este servico apenas valida — nao ha como
  # emitir um token a partir daqui.
  secret: ${JWT_SECRET:desenvolvimento-local-troque-este-segredo-antes-de-publicar}
  issuer: ticket-platform-auth

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

  # Tracing distribuido. Ver o comentario no booking-service para a decisao de amostragem.
  tracing:
    sampling:
      probability: ${TRACING_AMOSTRAGEM:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  # Prefixa cada linha com dois identificadores: o X-Request-Id, posto no MDC pelo
  # CorrelacaoServletFilter, e o traceId do OpenTelemetry, posto pelo Micrometer Tracing.
  #
  # Sao dois porque servem a momentos diferentes. O requestId e o que aparece na tela de erro e
  # que o usuario consegue ditar; o traceId e o que se cola na busca do Jaeger. Com os dois na
  # mesma linha, ir de um ao outro e um grep.
  #
  # `pattern.correlation` e um encaixe que o Boot ja reserva dentro do padrao padrao: preenche-lo
  # evita redefinir data, nivel e thread so para acrescentar campos. Preencher e tambem o que
  # impede o Boot de trocar este campo pelo formato proprio dele assim que o tracing entra no
  # classpath. O `:-` deixa cada campo vazio fora do respectivo contexto.
  pattern:
    correlation: "[%X{requestId:-} %X{traceId:-}] "
  level:
    com.devbandeiraa.eventservice: DEBUG

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    # Caminho prefixado com o proprio recurso, e nao o `/v3/api-docs` padrao. O motivo e o
    # gateway: ele aplica `StripPrefix=1` a tudo, entao `/api/events/v3/api-docs` chega aqui
    # como `/events/v3/api-docs`. Com o caminho padrao seria preciso uma rota dedicada no
    # gateway so para a documentacao, com filtros para desfazer o strip; assim a especificacao
    # viaja pela mesma rota que ja existe para o recurso.
    path: /events/v3/api-docs
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    # A interface agregada mora no gateway. Esta aqui serve para abrir o servico isolado
    # durante o desenvolvimento, sem subir a plataforma inteira.
    path: /swagger-ui.html
    # Ordena as operacoes pelo verbo em vez da ordem de declaracao no controller, que nao
    # significa nada para quem le.
    operationsSorter: method
    tagsSorter: alpha
