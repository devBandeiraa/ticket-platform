server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: event-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${EVENT_DB_NAME:eventdb}
    username: ${EVENT_DB_USER:event_user}
    password: ${EVENT_DB_PASSWORD:event_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.devbandeiraa.eventservice: DEBUG
