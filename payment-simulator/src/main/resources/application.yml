server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: payment-simulator

# O quanto este provedor falso se comporta mal.
#
# Os padroes sao pensados para a demonstracao, e nao para uma media realista: 30% de falha
# transitoria e mais do que qualquer provedor de verdade, e e de proposito. Com 2% seria preciso
# gravar cinquenta pagamentos para o retry aparecer uma vez.
#
# Para rodar os testes de integracao da plataforma, zere os dois: um teste de reserva que falha
# porque o simulador sorteou mal nao esta testando reserva, esta testando o dado.
simulacao:
  falha-percentual: ${PAGAMENTO_FALHA_PERCENTUAL:30}
  # Bem menor que a falha: a recusa e definitiva, e uma taxa alta faria a demonstracao passar mais
  # tempo mostrando o caminho em que o retry nao ajuda do que aquele em que ele salva a compra.
  recusa-percentual: ${PAGAMENTO_RECUSA_PERCENTUAL:5}
  # Um provedor de pagamento real leva centenas de milissegundos. E esse tempo que faz o timeout
  # de quem chama ser uma decisao real, e nao um numero copiado de um tutorial.
  latencia: ${PAGAMENTO_LATENCIA:200ms}
  latencia-extra: ${PAGAMENTO_LATENCIA_EXTRA:400ms}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

  # Metricas no formato do Prometheus. Ver o comentario no booking-service para o porque das
  # faixas de latencia e do custo de cardinalidade que elas trazem.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s

  # Tracing distribuido. Ver o comentario no booking-service para a decisao de amostragem.
  tracing:
    sampling:
      probability: ${TRACING_AMOSTRAGEM:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  # Prefixa cada linha com dois identificadores: o X-Request-Id, posto no MDC pelo
  # CorrelacaoServletFilter, e o traceId do OpenTelemetry, posto pelo Micrometer Tracing.
  #
  # Sao dois porque servem a momentos diferentes. O requestId e o que aparece na tela de erro e
  # que o usuario consegue ditar; o traceId e o que se cola na busca do Jaeger. Com os dois na
  # mesma linha, ir de um ao outro e um grep.
  #
  # `pattern.correlation` e um encaixe que o Boot ja reserva dentro do padrao padrao: preenche-lo
  # evita redefinir data, nivel e thread so para acrescentar campos. Preencher e tambem o que
  # impede o Boot de trocar este campo pelo formato proprio dele assim que o tracing entra no
  # classpath. O `:-` deixa cada campo vazio fora do respectivo contexto.
  pattern:
    correlation: "[%X{requestId:-} %X{traceId:-}] "
  level:
    com.devbandeiraa.paymentsimulator: DEBUG
