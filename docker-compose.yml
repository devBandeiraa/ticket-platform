# Plataforma de ingressos completa: infraestrutura, observabilidade, os servicos e o frontend.
#
#     docker compose up --build      sobe tudo
#     docker compose up postgres redis rabbitmq
#                                    so a infraestrutura, para rodar um servico pela IDE
#
# Depois de tudo no ar:
#     http://localhost:5173          a aplicacao
#     http://localhost:8080/swagger-ui.html   a documentacao da API
#     http://localhost:16686         o Jaeger, para seguir uma requisicao entre os servicos
#     http://localhost:3000          o Grafana, com os paineis ja carregados (nao pede login)
#     http://localhost:9090          o Prometheus, para conferir a coleta e testar uma consulta

name: ticket-platform

# ---------------------------------------------------------------------------
# Blocos reaproveitados
# ---------------------------------------------------------------------------

# Endereco dos servicos de apoio DENTRO da rede do compose. Deliberadamente separado das
# portas publicadas no host: quem troca a porta publicada para fugir de um conflito local
# nao pode, com isso, quebrar a conexao entre os containers.
x-infra-interna: &infra-interna
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_HOST: redis
  REDIS_PORT: 6379
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER:-ticket}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ticket}
  JWT_SECRET: ${JWT_SECRET:-desenvolvimento-local-troque-este-segredo-antes-de-publicar}

# Destino dos spans. Bloco separado do de infraestrutura porque o payment-simulator precisa
# deste, mas nao daquele: ele nao tem banco, nem Redis, nem broker — e ainda assim tem de
# aparecer no trace, senao a chamada de pagamento termina num ponto cego.
x-observabilidade: &observabilidade
  OTLP_ENDPOINT: http://jaeger:4318/v1/traces
  TRACING_AMOSTRAGEM: ${TRACING_AMOSTRAGEM:-1.0}

x-servico-java: &servico-java
  restart: unless-stopped
  build:
    context: .
    dockerfile: docker/Dockerfile.servico

# wget do busybox, ja presente na imagem alpine: instalar curl so para o healthcheck
# acrescentaria pacote e superficie a uma imagem que nao precisa dele.
#
# O endereco e 127.0.0.1, e nao `localhost`: dentro do container `localhost` resolve para
# ::1 antes do IPv4, e um processo que so escuta em IPv4 recusa a conexao — o container fica
# eternamente unhealthy servindo perfeitamente bem.
x-healthcheck-java: &healthcheck-java
  interval: 10s
  timeout: 5s
  retries: 12
  # Generoso porque a primeira subida roda as migrations do Flyway.
  start_period: 60s

services:
  # -------------------------------------------------------------------------
  # Infraestrutura
  # -------------------------------------------------------------------------

  postgres:
    image: postgres:17-alpine
    container_name: ticket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      # Consumidas pelo script de inicializacao para criar um banco e um usuario
      # dedicados por servico.
      AUTH_DB_NAME: ${AUTH_DB_NAME:-authdb}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
      EVENT_DB_NAME: ${EVENT_DB_NAME:-eventdb}
      EVENT_DB_USER: ${EVENT_DB_USER:-event_user}
      EVENT_DB_PASSWORD: ${EVENT_DB_PASSWORD:-event_pass}
      BOOKING_DB_NAME: ${BOOKING_DB_NAME:-bookingdb}
      BOOKING_DB_USER: ${BOOKING_DB_USER:-booking_user}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:-booking_pass}
    ports:
      # Publicado em 5433 no host de proposito: maquinas de desenvolvimento
      # costumam ter um PostgreSQL nativo ocupando a 5432, e as duas instancias
      # escutando na mesma porta fazem a aplicacao conectar na errada.
      # Dentro da rede do compose o Postgres continua em 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Roda apenas na primeira subida, quando o volume ainda esta vazio.
      #
      # O script mora em k8s/base porque o Kustomize so le arquivos abaixo do proprio
      # diretorio, e manter duas copias faria uma divergir da outra. E o mesmo arquivo nos
      # dois ambientes.
      - ./k8s/base/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ticket-redis
    restart: unless-stopped
    # appendonly garante que o estado sobreviva a um restart do container. O lock
    # distribuido em si e efemero, mas o rate limiting do gateway agradece.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: ticket-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ticket}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ticket}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # -------------------------------------------------------------------------
  # Observabilidade
  # -------------------------------------------------------------------------

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: ticket-jaeger
    restart: unless-stopped
    environment:
      # O all-in-one nasce falando apenas o protocolo nativo do Jaeger. Sem este flag a porta
      # 4318 nem abre, e os servicos exportariam spans contra uma porta fechada — em silencio,
      # porque o exportador OTLP nao derruba a aplicacao quando o coletor nao responde.
      COLLECTOR_OTLP_ENABLED: "true"
      # Guarda os traces em memoria. Nao ha volume de proposito: sao dados de diagnostico de um
      # ambiente de desenvolvimento, e um `docker compose down` deve limpa-los junto com o resto.
      # O limite existe para o container nao crescer sem teto numa sessao longa de testes.
      MEMORY_MAX_TRACES: ${JAEGER_MAX_TRACES:-20000}
    ports:
      # Interface web. E o unico destes enderecos que uma pessoa abre.
      - "${JAEGER_UI_PORT:-16686}:16686"
      # Receptor OTLP sobre HTTP. Publicado no host para permitir rodar um servico pela IDE,
      # fora do compose, e ainda assim ver os spans dele aqui.
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
    healthcheck:
      # A porta 14269 e a de administracao do Jaeger, e responde /
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:14269/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ticket-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Seis horas de historico. Um painel de portfolio nao precisa de semanas de serie temporal,
      # e o disco de quem clona o repositorio agradece.
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENCAO:-6h}
      # Permite recarregar o prometheus.yml com um POST em /-/reload, sem reiniciar o container e
      # portanto sem perder as series ja coletadas.
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:11.5.2
    container_name: ticket-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Leitura sem login. E uma decisao de ambiente de desenvolvimento, nao um descuido: numa
      # demonstracao gravada, uma tela de login no meio do caminho so atrapalha, e nao ha nada
      # aqui alem de metricas de uma plataforma de mentira. Publicando de verdade, remova as
      # tres linhas abaixo — a conta de administrador continua existindo para editar.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_DEFAULT_THEME: dark
      # Silencia a checagem de versao e a telemetria: sao chamadas para fora que nao fazem falta
      # e que poluem o log de quem sobe isto sem internet.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      # Fonte de dados e provedor de dashboards, lidos na subida.
      #
      # Montados um a um, e nao o diretorio `provisioning` inteiro: a imagem ja traz `plugins/` e
      # `alerting/` vazios, e substituir a pasta inteira os faria sumir — o Grafana entao registra
      # um ERROR na subida para cada um. Nada quebra, mas o log de arranque passa a ter erros que
      # nao sao erros, o que e pior do que parece: ensina quem le a ignorar erros.
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # Os JSONs dos paineis. Montados somente-leitura de proposito: o Grafana nao deve reescrever
      # um arquivo versionado, e uma edicao feita na tela morre no proximo restart.
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------------------------------
  # Servicos
  # -------------------------------------------------------------------------

  auth-service:
    <<: *servico-java
    container_name: ticket-auth
    build:
      context: .
      dockerfile: docker/Dockerfile.servico
      args:
        MODULO: auth-service
        PORTA: 8081
    environment:
      <<: [*infra-interna, *observabilidade]
      SERVER_PORT: 8081
      AUTH_DB_NAME: ${AUTH_DB_NAME:-authdb}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
      # O seed do primeiro administrador vive sob o profile `dev`, e sem ele o banco nasce
      # sem admin algum — nao havendo, portanto, caminho para criar o primeiro evento, ja
      # que o cadastro publico sempre gera USER.
      #
      # Ligado por padrao porque este compose E o ambiente de desenvolvimento. Publicando de
      # verdade, defina AUTH_PROFILE vazio: o admin com senha publicamente conhecida deixa de
      # existir.
      SPRING_PROFILES_ACTIVE: ${AUTH_PROFILE-dev}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/actuator/health || exit 1"]

  event-service:
    <<: *servico-java
    container_name: ticket-event
    build:
      context: .
      dockerfile: docker/Dockerfile.servico
      args:
        MODULO: event-service
        PORTA: 8082
    environment:
      <<: [*infra-interna, *observabilidade]
      SERVER_PORT: 8082
      EVENT_DB_NAME: ${EVENT_DB_NAME:-eventdb}
      EVENT_DB_USER: ${EVENT_DB_USER:-event_user}
      EVENT_DB_PASSWORD: ${EVENT_DB_PASSWORD:-event_pass}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8082/actuator/health || exit 1"]

  booking-service:
    <<: *servico-java
    container_name: ticket-booking
    build:
      context: .
      dockerfile: docker/Dockerfile.servico
      args:
        MODULO: booking-service
        PORTA: 8083
    environment:
      <<: [*infra-interna, *observabilidade]
      SERVER_PORT: 8083
      BOOKING_DB_NAME: ${BOOKING_DB_NAME:-bookingdb}
      BOOKING_DB_USER: ${BOOKING_DB_USER:-booking_user}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:-booking_pass}
      # Chamada servico a servico, por dentro da rede: nao passa pelo gateway. O gateway e a
      # porta de entrada de quem vem de fora, e por ele so o transito interno ganharia um
      # salto de rede e um ponto de falha a mais.
      EVENT_SERVICE_URL: http://event-service:8082
      PAYMENT_SERVICE_URL: http://payment-simulator:8085
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # `service_started` como o event-service, e pelo mesmo motivo: o provedor so e chamado no
      # pagamento, e o retry ja cobre a janela em que ele ainda esta subindo.
      payment-simulator:
        condition: service_started
      # Nao e `service_healthy`: a hidratacao do estoque so acontece na primeira reserva de
      # cada evento, e falhar ate la nao impede o booking-service de subir.
      event-service:
        condition: service_started
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8083/actuator/health || exit 1"]

  # Terceiro de mentira: instavel de proposito, para o retry do booking-service ter contra o que
  # se defender. Nao e publicado pelo gateway — so responde de dentro da rede, como um provedor
  # externo responderia apenas ao servidor e nunca ao navegador.
  payment-simulator:
    <<: *servico-java
    container_name: ticket-payment
    build:
      context: .
      dockerfile: docker/Dockerfile.servico
      args:
        MODULO: payment-simulator
        PORTA: 8085
    environment:
      <<: *observabilidade
      SERVER_PORT: 8085
      # Alto de proposito: com 2% seria preciso gravar cinquenta pagamentos para o retry aparecer
      # uma vez. Zere as duas variaveis para rodar sem instabilidade.
      PAGAMENTO_FALHA_PERCENTUAL: ${PAGAMENTO_FALHA_PERCENTUAL:-30}
      PAGAMENTO_RECUSA_PERCENTUAL: ${PAGAMENTO_RECUSA_PERCENTUAL:-5}
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8085/actuator/health || exit 1"]

  notification-service:
    <<: *servico-java
    container_name: ticket-notification
    build:
      context: .
      dockerfile: docker/Dockerfile.servico
      args:
        MODULO: notification-service
        PORTA: 8084
    environment:
      <<: [*infra-interna, *observabilidade]
      SERVER_PORT: 8084
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8084/actuator/health || exit 1"]

  api-gateway:
    <<: *servico-java
    container_name: ticket-gateway
    build:
      context: .
      dockerfile: docker/Dockerfile.servico
      args:
        MODULO: api-gateway
        PORTA: 8080
    environment:
      <<: [*infra-interna, *observabilidade]
      SERVER_PORT: 8080
      AUTH_SERVICE_URI: http://auth-service:8081
      EVENT_SERVICE_URI: http://event-service:8082
      BOOKING_SERVICE_URI: http://booking-service:8083
      # Origem do navegador, e nao nome de container: o preflight parte da maquina de quem
      # acessa. Precisa casar com a porta em que o frontend e publicado.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      # `service_started`, e nao `healthy`: o gateway resolve o destino por requisicao, entao
      # sobe e responde 503 no que ainda nao estiver pronto, em vez de segurar a subida
      # inteira esperando pelo servico mais lento.
      auth-service:
        condition: service_started
      event-service:
        condition: service_started
      booking-service:
        condition: service_started
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]

  frontend:
    container_name: ticket-frontend
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        # Endereco que o NAVEGADOR usa. Embutido no bundle pelo Vite na compilacao — trocar
        # depois exige reconstruir a imagem, nao basta mudar a variavel.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  # Series temporais coletadas. Tem volume, diferente do Jaeger: um grafico de latencia so diz
  # alguma coisa comparado com o de ontem, e reiniciar o container nao deveria apagar essa
  # comparacao. Os traces do Jaeger sao o oposto — servem para investigar uma requisicao especifica,
  # agora, e nao ganham nada sobrevivendo ao restart.
  prometheus-data:
  # Guarda o que e do Grafana e nao do repositorio: preferencias, ultima pasta aberta, sessao.
  # Os paineis e a fonte de dados nao moram aqui, e sim nos arquivos provisionados.
  grafana-data:
